# Render Blueprint — https://render.com/docs/blueprint-spec
# One web service (API + built React app) and one PostgreSQL database.
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false`
# are asked for during setup.

databases:
  - name: og-sports-db
    databaseName: og_sports
    user: og_sports
    plan: free               # demo: expires after 30 days. For the real club use basic-256mb
    region: singapore        # closest Render region to India
    postgresMajorVersion: "16"

services:
  - type: web
    name: og-sports-club
    runtime: node
    plan: free               # demo: sleeps when idle. For the real club use starter
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: og-sports-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"       # internal connection string; set true if you use the external URL
      - key: CLUB_TIMEZONE
        value: Asia/Kolkata
      - key: PUBLIC_URL
        sync: false          # e.g. https://og-sports-club.onrender.com or your custom domain
      - key: ADMIN_EMAILS
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # venue = customers pay at the club (no online payment).
      # To take UPI/online payments: set this to razorpay and add
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET and RAZORPAY_WEBHOOK_SECRET.
      - key: PAYMENT_PROVIDER
        value: venue
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
